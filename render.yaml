databases:
  - name: travel-companion-db
    plan: free
    region: singapore
    databaseName: travel_companion_db_krgc
    user: travel_companion_db_krgc_user

services:
  - type: web
    name: travel-companion-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FORCE_SECURE_COOKIE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: travel-companion-db
          property: connectionString
